[package]
name = "ode"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop lyrics reader for the Genius API"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_8", "v4_10"] }
libadwaita = { version = "0.8", features = ["v1_7"] }
gdk4 = "0.10"
gio = "0.21"
glib = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1"
webkit6 = { version = "0.5", features = ["v2_42"] }

[profile.release]
lto = true
