name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust + GTK4/libadwaita/webkit; the regression barrier everything else is a
  # build check around.
  # libadwaita >= 1.7 is required; ubuntu-latest hosts only 1.5, so run in a
  # debian:trixie container (fresh enough) like the distro matrix does.
  tests:
    name: tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates
          ./scripts/deps.sh --install
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # One container per target distribution: catches a renamed package or a
  # module that stops compiling on a system we claim to support.
  distros:
    name: build on ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian, image: "debian:trixie", bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git" }
          - { name: Ubuntu, image: "ubuntu:rolling", bootstrap: "apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git" }
          - { name: Fedora, image: "fedora:latest", bootstrap: "dnf install -y curl ca-certificates git" }
          - { name: Arch, image: "archlinux:latest", bootstrap: "pacman -Sy --noconfirm curl ca-certificates git" }
          # ALT is deliberately absent: it is the maintainer's own distribution,
          # covered by building there by hand.
    steps:
      - name: Bootstrap the container
        run: ${{ matrix.bootstrap }}
      - uses: actions/checkout@v5
      - name: Resolve dependencies
        run: ./scripts/deps.sh --install
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release

  # Produce every Linux artifact here too, so a packaging regression is caught
  # on a branch, not at a tag. The AppImage needs linuxdeploy downloads.
  # Container like the distro matrix: ubuntu-latest hosts libadwaita 1.5, which
  # is below what Ode needs (rpm for check-package-deps, curl for linuxdeploy).
  packages:
    name: packages
    runs-on: ubuntu-latest
    container: debian:trixie
    needs: [tests]
    steps:
      - name: Bootstrap the container
        run: apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git rpm
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: ./scripts/deps.sh --install
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package.sh
      - name: Dependencies must come from sonames, not package names
        run: ./scripts/check-package-deps.sh
      - run: ./scripts/appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/appimage/*.AppImage