name: Release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` builds every Linux
# format and attaches it to a GitHub release. The manual trigger exists so a
# failed publish can be retried without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # Empty means "build whatever ref this was dispatched from", which is
        # how a branch is test-built before its tag exists.
        description: Existing tag to build (blank = this branch)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # deb and rpm come out of cargo-deb / cargo-generate-rpm, and the soname
  # check that guards dependency lists in CI runs here too: a release must not
  # ship a package whose dependencies name distribution packages.
  native:
    name: deb + rpm
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Bootstrap the container
        run: apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git rpm
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install build dependencies
        run: ./scripts/deps.sh --install
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package.sh
      - name: Dependencies must come from sonames, not package names
        run: ./scripts/check-package-deps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Bootstrap the container
        run: apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install build dependencies
        run: ./scripts/deps.sh --install
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error

  # Flathub submission is a different thing; this only produces a single-file
  # bundle a user can `flatpak install` directly.
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install runtime and SDKs
        run: |
          sudo flatpak install -y flathub \
            org.gnome.Platform//48 org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build
        run: |
          sudo flatpak-builder --force-clean \
            --repo=repo --install-deps-from=flathub \
            build packaging/flatpak/org.example.Ode.yml
      - name: Bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          sudo flatpak build-bundle repo \
            "Ode_${version}_x86_64.flatpak" org.example.Ode
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: publish
    needs: [native, appimage, flatpak]
    runs-on: ubuntu-latest
    # A branch dispatch is a build check: the artifacts are enough, and a
    # release draft off an untagged commit would be noise.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      # A shallow clone would silently produce an empty changelog.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Checksums
        run: |
          find artifacts -type f -printf '%p\n' | sort
          find artifacts -type f -exec sha256sum {} + \
            | sed 's| .*/| |' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.flatpak
            SHA256SUMS